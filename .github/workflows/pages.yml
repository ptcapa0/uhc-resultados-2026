name: Build, verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Privacy gate
        run: |
          ! find . -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' \) -not -path './node_modules/*' | grep .
          ! rg -n --glob '!node_modules/**' --glob '!package-lock.json' '419[,.]6|550[,.]5|4[.]192[,.]5|585[,.]4' .
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
